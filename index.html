<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easy 3 Jazz | Live Music Warwickshire</title>
  <meta name="description" content="Easy 3 is a jazz quintet based in Leamington Spa, performing in and around Warwickshire and Coventry. Live music for weddings, private events, restaurants and festivals.">
  <link rel="stylesheet" href="style2.css">
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico?">
</head>
<body>

  <!-- Header Image -->
  <img src="e3title.png" class="header-img">

  <!-- Main Photo -->
  <img src="easy3sketches.png" class="photo-img">

  <!-- Two-Column Section -->
  <div class="content-section">

    <!-- Left Column -->
    <div class="left-column">

      <h2 class="gigs-label">Upcoming Gigs!</h2>

      <div class="gigs-timeline">

        <div class="gig-item" data-date="2026-11-27">
          <div class="gig-date">Fri 27 Nov</div>
          <div class="gig-details">Southbound Leamington</div>
        </div>

        <div class="gig-item" data-date="2026-12-13">
          <div class="gig-date">Sun 13 Dec</div>
          <div class="gig-details">Temperance Leamington (Ticketed) - 2:30pm</div>
        </div>

      </div>

      <br>

      <!-- Ticket Section -->
      <div class="ticket-section">

        <div class="ticket-item" data-date="2026-07-10">
          <h3 class="section-label">
            <a href="https://criteriontheatre.co.uk/seats/10554" target="_blank">
              Criterion Tickets
            </a>
          </h3>
          <a href="https://criteriontheatre.co.uk/seats/10554" target="_blank">
            <img src="criterion ticket.png" alt="Criterion Tickets" class="ticket-img">
          </a>
        </div>

        <div class="ticket-item" data-date="2026-10-11">
          <h3 class="section-label">
            <a href="https://www.eventbrite.co.uk/e/sunday-jazz-temperance-easy-3-jazz-quartet-ft-vocals-of-mary-savva-tickets-1992048148637?aff=oddtdtcreator" target="_blank">
              Temperance Tickets
            </a>
          </h3>
          <a href="https://www.eventbrite.co.uk/e/sunday-jazz-temperance-easy-3-jazz-quartet-ft-vocals-of-mary-savva-tickets-1992048148637?aff=oddtdtcreator" target="_blank">
            <img src="temperance ticket.png" alt="Temperance Tickets" class="ticket-img">
          </a>
        </div>
      </div>

    </div>

    <!-- Right Column -->
    <div class="right-column">

      <h3 class="section-label">
        <a href="https://www.instagram.com/easy3jazz/" target="_blank">Instagram</a>
      </h3>
      <div class="widget instagram-widget">
        <div class="responsive-iframe">
          <iframe src="https://www.instagram.com/easy3jazz/embed"></iframe>
        </div>
      </div>

      <h3 class="section-label">
        <a href="https://www.facebook.com/easy3music/" target="_blank">Facebook</a>
      </h3>
      <div class="widget facebook-widget">
        <div class="responsive-iframe">
          <iframe src="https://www.facebook.com/plugins/page.php?href=https%3A%2F%2Fwww.facebook.com%2Feasy3music&tabs=timeline"></iframe>
        </div>
      </div>

      <h3 class="section-label">
        <a href="https://open.spotify.com/artist/3spb6QuZH1WEDUc6hO6ICO" target="_blank">Spotify</a>
      </h3>
      <div class="widget spotify-widget">
        <div class="responsive-iframe">
          <iframe src="https://open.spotify.com/embed/artist/3spb6QuZH1WEDUc6hO6ICO"></iframe>
        </div>
      </div>

      <h3 class="section-label">
        <a href="https://www.youtube.com/channel/UCj1pSSJbDlFP8uwTQiOeNxg" target="_blank">YouTube</a>
      </h3>
      <div class="widget youtube-widget">
        <div class="responsive-iframe">
          <iframe src="https://www.youtube.com/embed/jDuuYPHIUm8"></iframe>
        </div>
      </div>


      <br>

      <p class="email-address">easy3music@hotmail.com</p>
      <div class="form-container">
        <div class="responsive-iframe form-iframe">
          <iframe src="https://docs.google.com/forms/d/e/1FAIpQLScKUbdo0U6E2jbcE9BhyeeKNx7k9BESyyRaLlvH_Rn8vuzkmA/viewform?embedded=true"></iframe>
        </div>
      </div>

    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const today = new Date();
      today.setHours(0, 0, 0, 0);

      document.querySelectorAll('.gig-item').forEach(gig => {
        const gigDate = new Date(gig.dataset.date);

        if (gigDate < today) {
          gig.style.display = 'none';
        }
      });

      document.querySelectorAll('.ticket-item').forEach(ticket => {
        const ticketDate = new Date(ticket.dataset.date);

        if (ticketDate < today) {
          ticket.style.display = 'none';
        }
      });
    });
  </script>

</body>
</html>
